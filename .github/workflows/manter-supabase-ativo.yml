# Mantém o Supabase (plano grátis) ligado: todo dia grava a data e a hora na
# tabela manter_ligado (uma linha só, sempre a mesma) e lê de volta. Só ler o banco
# não bastou pra o Supabase contar como uso. Usa a chave pública (anon) que já
# está no config.js; ela só enxerga essa tabelinha.
name: Manter o Supabase ativo

on:
  schedule:
    - cron: "37 14 * * *"   # todo dia, 11:37 em Brasília
  workflow_dispatch:         # botão "Run workflow" pra testar na hora

permissions:
  contents: read

jobs:
  alo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false

      - name: Gravar e ler no banco
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' config.js)
          AGORA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for tentativa in 1 2 3; do
            grava=$(curl -sS -o grava.txt -w '%{http_code}' -X POST "$URL/rest/v1/manter_ligado?on_conflict=id" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              -d "{\"id\": 1, \"em\": \"$AGORA\"}" || echo 000)
            le=$(curl -sS -o le.txt -w '%{http_code}' "$URL/rest/v1/manter_ligado?select=em" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || echo 000)
            if [ "$grava" = "201" ] || [ "$grava" = "200" ] || [ "$grava" = "204" ]; then
              if [ "$le" = "200" ]; then
                echo "Gravou e leu: $(cat le.txt)"
                exit 0
              fi
            fi
            echo "Tentativa $tentativa: gravar HTTP $grava $(cat grava.txt 2>/dev/null) | ler HTTP $le $(cat le.txt 2>/dev/null)"
            sleep 30
          done
          echo "O banco não respondeu. Se o projeto já estiver pausado, entre no painel do Supabase e clique em Resume."
          exit 1
